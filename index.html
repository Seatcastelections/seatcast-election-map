
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeatCast Historical Presidential Map</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #172033;
}

header {
  background: #101827;
  color: white;
  padding: 18px 22px;
}

.brand {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}

.brand span { color: #4da3ff; }

main { padding: 20px; }

h1 {
  margin: 0 0 7px;
  font-size: 25px;
}

.subtitle {
  color: #667085;
  margin-bottom: 18px;
}

#map {
  width: 100%;
  height: 650px;
  background: #e8edf3;
  border-radius: 10px;
  overflow: hidden;
}

.year-bar {
  background: white;
  border: 1px solid #dce2ea;
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.year-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.year-heading strong {
  font-size: 17px;
}

#selectedYear {
  color: #2166ac;
  font-weight: 800;
  font-size: 20px;
}

.year-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.year-button {
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  color: #263449;
  padding: 9px 15px;
  border-radius: 7px;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
}

.year-button:hover {
  background: #e8f1fc;
}

.year-button.active {
  background: #172b4d;
  border-color: #172b4d;
  color: white;
}

#yearSlider {
  width: 100%;
  cursor: pointer;
  accent-color: #2166ac;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  color: #667085;
  font-size: 12px;
  margin-top: 5px;
}

.legend {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  padding: 16px 0;
  font-size: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}

.swatch {
  width: 15px;
  height: 15px;
  border-radius: 3px;
}

#status {
  padding: 8px 0;
  color: #667085;
  font-size: 13px;
}

#errorBox {
  display: none;
  background: #fee2e2;
  color: #991b1b;
  padding: 12px;
  margin: 12px 20px;
  border-radius: 7px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

footer {
  padding: 20px;
  background: #101827;
  color: #aab4c5;
  text-align: center;
  font-size: 13px;
}

@media(max-width:650px) {
  #map { height: 500px; }
  main { padding: 12px; }
  .year-button { padding: 8px 11px; }
}
  .mode-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.mode-button {
  padding: 10px 18px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  background: white;
  cursor: pointer;
  font-weight: bold;
}

.mode-button.active {
  background: #172b4d;
  color: white;
  border-color: #172b4d;
}
.shift-controls {
  display: none;
  background: white;
  border: 1px solid #dce2ea;
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
}

.shift-controls select {
  margin: 8px 12px 8px 0;
  padding: 9px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <div class="brand">Seat<span>Cast</span></div>
</header>

<div id="errorBox"></div>

<main>
  <h1 id="mapTitle">2024 Presidential Election</h1>
  <div class="subtitle">
    Explore presidential election results by county.
    Select a county to view its results.
  </div>
  
<div class="mode-selector">
  <button id="resultsMode" class="mode-button active">
    Election Results
  </button>
  <button id="shiftMode" class="mode-button">
    County Shift
  </button>
</div>
  <div id="map"></div>

  <div class="year-bar">
    <div class="year-heading">
      <strong>Select an election year</strong>
      <span id="selectedYear">2024</span>
    </div>

    <div class="year-buttons" id="yearButtons">
      <button class="year-button" data-year="2000">2000</button>
      <button class="year-button" data-year="2004">2004</button>
      <button class="year-button" data-year="2008">2008</button>
      <button class="year-button" data-year="2012">2012</button>
      <button class="year-button" data-year="2016">2016</button>
      <button class="year-button" data-year="2020">2020</button>
      <button class="year-button active" data-year="2024">2024</button>
    </div>

    <input
      type="range"
      id="yearSlider"
      min="0"
      max="6"
      step="1"
      value="6"
      aria-label="Select election year"
    >

    <div class="slider-labels">
      <span>2000</span>
      <span>2024</span>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="swatch" style="background:#2166ac"></div>
      Democratic
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#c62828"></div>
      Republican
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#d1d5db"></div>
      No data
    </div>
  </div>

  <div id="status">Loading election data...</div>
</main>

<footer>
  SeatCast | Independent Election Analysis
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<script>
const years = [2000, 2004, 2008, 2012, 2016, 2020, 2024];

const errorBox = document.getElementById("errorBox");
const statusBox = document.getElementById("status");

function showError(message) {
  errorBox.style.display = "block";
  errorBox.textContent = "ERROR: " + message;
}

window.addEventListener("error", event => {
  showError(event.message);
});

window.addEventListener("unhandledrejection", event => {
  showError(String(event.reason));
});

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {},
    layers: [{
      id: "background",
      type: "background",
      paint: { "background-color": "#e8edf3" }
    }]
  },
  center: [-96, 38],
  zoom: 3.3,
  minZoom: 2,
  maxZoom: 12
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

let counties = null;
let resultsByYear = {};
let currentYear = 2024;

function getCountyFips(feature) {
  return String(feature.id).padStart(5, "0");
}

function getElectionFips(fips) {
  // Oglala Lakota County was previously recorded as Shannon County.
  if (fips === "46102") return "46113";
  return fips;
}

function updateMapForYear(year) {
  currentYear = Number(year);

  const electionResults = resultsByYear[currentYear] || {};

  document.getElementById("mapTitle").textContent =
    currentYear + " Presidential Election";

  document.getElementById("selectedYear").textContent = currentYear;

  document.getElementById("yearSlider").value =
    years.indexOf(currentYear);

  document.querySelectorAll(".year-button").forEach(button => {
    button.classList.toggle(
      "active",
      Number(button.dataset.year) === currentYear
    );
  });

  counties.features.forEach(feature => {
    const mapFips = getCountyFips(feature);
    const dataFips = getElectionFips(mapFips);
    const result = electionResults[dataFips];

    feature.properties.winner = result ? result.winner : "NA";
    feature.properties.dem = result ? result.dem : null;
    feature.properties.rep = result ? result.rep : null;
    feature.properties.total = result ? result.total : null;
    feature.properties.margin = result ? result.margin : null;
    feature.properties.demPct = result ? result.demPct : null;
    feature.properties.repPct = result ? result.repPct : null;
    feature.properties.countyName = result ? result.county : "";
    feature.properties.state = result ? result.state : "";
    feature.properties.electionYear = currentYear;
    feature.properties.mapFips = mapFips;
  });

  map.getSource("counties").setData(counties);

  statusBox.textContent =
    "Showing " + currentYear +
    " presidential results | " +
    Object.keys(electionResults).length +
    " county records in the data";
}

function selectYear(year) {
  updateMapForYear(year);
}

document.querySelectorAll(".year-button").forEach(button => {
  button.addEventListener("click", () => {
    selectYear(Number(button.dataset.year));
  });
});

document.getElementById("yearSlider").addEventListener("input", event => {
  selectYear(years[Number(event.target.value)]);
});

map.on("load", async () => {
  try {
    statusBox.textContent = "Loading county and state boundaries...";

    const boundaryResponse = await fetch(
      "https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json"
    );

    if (!boundaryResponse.ok) {
      throw new Error("Could not load county boundaries.");
    }

    const topology = await boundaryResponse.json();

    counties = topojson.feature(
      topology,
      topology.objects.counties
    );

    // Create state borders from the state boundary geometry.
    const stateBorders = topojson.mesh(
      topology,
      topology.objects.states,
      (a, b) => a !== b
    );

    statusBox.textContent = "Loading historical election results...";

    const dataResponse = await fetch(
      "./seatcast_presidential_history_2000_2024.json"
    );

    if (!dataResponse.ok) {
      throw new Error(
        "Could not load historical JSON. Check that the file is uploaded."
      );
    }

    const electionData = await dataResponse.json();

    electionData.forEach(result => {
      const year = Number(result.year);
      const fips = String(result.fips).padStart(5, "0");

      if (!resultsByYear[year]) {
        resultsByYear[year] = {};
      }

      resultsByYear[year][fips] = result;
    });

    map.addSource("counties", {
      type: "geojson",
      data: counties
    });

    map.addLayer({
      id: "county-fill",
      type: "fill",
      source: "counties",
      paint: {
        "fill-color": [
          "match",
          ["get", "winner"],
          "D", "#2166ac",
          "R", "#c62828",
          "T", "#bdbdbd",
          "#d1d5db"
        ],
        "fill-opacity": 0.9
      }
    });

    // Thin white lines between counties.
    map.addLayer({
      id: "county-outline",
      type: "line",
      source: "counties",
      paint: {
        "line-color": "#ffffff",
        "line-width": 0.35
      }
    });

    // Stronger dark outlines around each state.
    map.addSource("state-borders", {
      type: "geojson",
      data: {
        type: "Feature",
        geometry: stateBorders,
        properties: {}
      }
    });

    map.addLayer({
      id: "state-outline",
      type: "line",
      source: "state-borders",
      paint: {
        "line-color": "#263449",
        "line-width": [
          "interpolate",
          ["linear"],
          ["zoom"],
          2, 0.8,
          5, 1.5,
          8, 2
        ]
      }
    });

    updateMapForYear(2024);

    map.on("click", "county-fill", event => {
      const p = event.features[0].properties;

      if (p.dem === null || p.rep === null) {
        new maplibregl.Popup()
          .setLngLat(event.lngLat)
          .setHTML(`
            <strong>No election data found for this county.</strong>
            <br><br>
            Map FIPS: ${p.mapFips}
            <br>
            Election year: ${p.electionYear}
          `)
          .addTo(map);
        return;
      }

      const margin = Number(p.margin);

      const marginText =
        margin > 0 ? "D+" + margin.toLocaleString() :
        margin < 0 ? "R+" + Math.abs(margin).toLocaleString() :
        "Tied";

      const html = `
        <div style="font-family:Arial;min-width:210px">
          <strong style="font-size:16px">
            ${p.countyName || "County"}, ${p.state || ""}
          </strong>

          <div style="color:#667085;margin:5px 0 10px">
            ${p.electionYear} Presidential Election
          </div>

          <div style="color:#2166ac">
            Democratic: ${Number(p.dem).toLocaleString()}
            (${Number(p.demPct).toFixed(2)}%)
          </div>

          <div style="color:#c62828">
            Republican: ${Number(p.rep).toLocaleString()}
            (${Number(p.repPct).toFixed(2)}%)
          </div>

          <hr>

          <div>Total votes: ${Number(p.total).toLocaleString()}</div>
          <strong>Margin: ${marginText}</strong>
        </div>
      `;

      new maplibregl.Popup()
        .setLngLat(event.lngLat)
        .setHTML(html)
        .addTo(map);
    });

    map.on("mouseenter", "county-fill", () => {
      map.getCanvas().style.cursor = "pointer";
    });

    map.on("mouseleave", "county-fill", () => {
      map.getCanvas().style.cursor = "";
    });

  } catch (error) {
    showError(error.message);
    statusBox.textContent = "Map failed to load.";
  }
});
</script>

</body>
</html>
